<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://myleadsmap.com/" />
    <link rel="manifest" href="/manifest.json" />
    <title>MyLeadsMap — Map Your Local Business Leads</title>
    <meta name="description" content="MyLeadsMap turns Google Places into a visual sales pipeline. Search any local business type, plot prospects on a map, and track every interaction from first call to closed deal." />
    <meta name="keywords" content="lead generation, local business leads, sales pipeline, Google Places, map leads, CRM, prospect tracking, business outreach" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyLeadsMap" />
    <meta property="og:title" content="MyLeadsMap — Map Your Local Business Leads" />
    <meta property="og:description" content="Turn Google Places into a visual sales pipeline. Search any business type, plot prospects on a map, and track every interaction from first call to closed deal." />
    <meta property="og:image" content="/images/about-hero.png" />
    <meta property="og:url" content="https://myleadsmap.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyLeadsMap — Map Your Local Business Leads" />
    <meta name="twitter:description" content="Turn Google Places into a visual sales pipeline. Search, map, and track local business leads." />
    <meta name="twitter:image" content="/images/about-hero.png" />

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MyLeadsMap",
      "description": "MyLeadsMap turns Google Places into a visual sales pipeline. Search any local business type, plot prospects on a map, and track every interaction from first call to closed deal.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": [
        {
          "@type": "Offer",
          "name": "Standard",
          "price": "9.99",
          "priceCurrency": "USD",
          "description": "Use your own Google API key, 50 lead storage, condensed pipeline, contact logging."
        },
        {
          "@type": "Offer",
          "name": "Premium",
          "price": "29.99",
          "priceCurrency": "USD",
          "description": "Unlimited business searches, 1,000 lead storage, full pipeline tracking, custom map markers."
        }
      ],
      "featureList": [
        "Discover local businesses via Google Places",
        "Interactive map view with custom category markers",
        "Lead pipeline tracking from Prospect to Closed",
        "Contact management with full action history"
      ]
    }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is MyLeadsMap?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "MyLeadsMap is a lead generation and sales pipeline tool that turns Google Places into a visual, map-based pipeline. You can search any local business type, plot prospects on a map, and track every interaction from first call to closed deal."
          }
        },
        {
          "@type": "Question",
          "name": "How does lead pipeline tracking work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Leads move through stages from Prospect to Pitched to Following Up to Closed. You can log every call, email, and conversation, and view the full action history for each lead."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between Standard and Premium plans?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Standard plan at $9.99 per month lets you use your own free Google API key with 50 lead storage and a condensed open/closed pipeline. The Premium plan at $29.99 per month includes unlimited business searches, 1,000 lead storage, full pipeline tracking, and custom map markers."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use my own Google API key?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Standard plan users provide their own free Google Maps API key for business searches. Premium users get unlimited searches covered by the app's shared API key."
          }
        },
        {
          "@type": "Question",
          "name": "How many leads can I store?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Standard plan users can store up to 50 leads. Premium plan users can store up to 1,000 leads with full action history."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
